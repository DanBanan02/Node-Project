<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Big+Shoulders:opsz@10..72&family=Black+Ops+One&family=Isometra&family=Lexend+Deca&family=Press+Start+2P&family=Rubik+Dirt&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
        <script type="module" src="rpg.js"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <header>
        <h2>Password Generator</h2>
    </header>

    <body>
        <div class="PWG">
            <div>
                <label id="textBox" for="password-length">Amount:  </label>
                <input id="password-length" title="Guide: add the length in numbers" type="number" value="16" min="1">
            </div>
            
                <div id="Btn-setup">
                    <div>
                        <button id="Copy-btn">Copy Password</button>
                    </div>
                    <div>
                        <button id="generate-btn" title="Guide: when Password length is choosen, then press the button.">Generate</button>
                    </div>
                </div>
            <br>
        </div>
        <div id="txt-area">
            <textarea id="password-output" placeholder="Generated Password"></textarea>
        </div>
    </body>
</html>
